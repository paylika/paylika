<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Paylika — Votre accès</title>
<style>
  :root { --bordeaux:#7B1126; --forest:#2F6B4F; --ink:#18181B; --muted:#71717A; --line:rgba(0,0,0,.09); }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; background:#fff; color:var(--ink); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; min-height:100vh; }
  .wrap { max-width:440px; margin:0 auto; padding:28px 18px 40px; min-height:100vh; display:flex; flex-direction:column; justify-content:center; }
  .brand { display:flex; align-items:center; justify-content:center; gap:9px; margin-bottom:18px; }
  .brand .mk { width:38px; height:38px; border-radius:11px; background:var(--bordeaux); display:flex; align-items:center; justify-content:center; color:#fff; font-weight:800; font-size:22px; }
  .brand b { font-size:22px; letter-spacing:-.5px; }
  .brand b span { color:var(--bordeaux); }
  .card { border:1px solid var(--line); border-radius:20px; padding:22px 18px; }
  .center { text-align:center; }
  .spin { width:28px;height:28px;border:3px solid rgba(123,17,38,.16);border-top-color:var(--bordeaux);border-radius:50%;animation:s .8s linear infinite;margin:6px auto 0; }
  @keyframes s { to { transform:rotate(360deg); } }
  .tick { width:52px;height:52px;border-radius:50%;background:var(--forest);display:flex;align-items:center;justify-content:center;margin:0 auto; color:#fff; font-size:26px; font-weight:800; }
  h2 { font-size:18px; margin:14px 0 0; }
  .sub { font-size:13px; color:var(--muted); margin:5px 0 0; }
  .small { font-size:11px; color:var(--muted); margin:8px 0 0; }
  a.btn { display:flex; align-items:center; justify-content:center; gap:6px; text-decoration:none; background:var(--bordeaux); color:#fff; font-size:15px; font-weight:800; padding:15px; border-radius:16px; margin-top:18px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="brand"><span class="mk">P</span><b>Pay<span>lika</span></b></div>
  <div id="app" class="card center"><div class="spin"></div><h2>Paiement en cours de confirmation…</h2><p class="sub">Quelques secondes. Ne fermez pas cette page.</p></div>
</div>
<script>
(function(){
  var STATUS = "https://xkdiodbppotyiyldlwbg.functions.supabase.co/access-status";
  var qs = new URLSearchParams(location.search);
  var ref = qs.get("ref") || "";
  if (!ref) { try { ref = localStorage.getItem("paylika_last_ref") || ""; } catch(e){} }
  var app = document.getElementById("app");

  if (!ref) {
    app.innerHTML = '<p class="sub">Aucun paiement à afficher. Revenez depuis votre lien de paiement.</p>';
    return;
  }

  function esc(s){ return String(s==null?"":s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];}); }

  function done(d){
    var name = d.offerName ? '<p class="sub">'+esc(d.offerName)+'</p>' : '';
    var action;
    if (d.deliveryType === "whatsapp" && d.target) {
      action = '<a class="btn" href="'+esc(d.target)+'" target="_blank" rel="noopener">Rejoindre le groupe WhatsApp ↗</a>'
        + '<p class="small">Cliquez pour ouvrir WhatsApp et rejoindre le groupe.</p>';
    } else if (d.deliveryType === "link" && d.target) {
      action = '<a class="btn" href="'+esc(d.target)+'" target="_blank" rel="noopener"'+(d.isFile?' download':'')+'>'
        + (d.isFile ? "Télécharger le fichier ↓" : "Accéder au contenu ↗") + '</a>'
        + (d.isFile ? '<p class="small">Lien de téléchargement valable 1 heure.</p>' : '');
    } else {
      action = '<p class="sub" style="margin-top:12px">Merci ! Votre paiement est bien enregistré.</p>';
    }
    app.innerHTML = '<div class="tick">✓</div><h2>Paiement confirmé</h2>'+name+action;
  }

  var n = 0, timer;
  function tick(){
    fetch(STATUS+"?ref="+encodeURIComponent(ref))
      .then(function(r){ return r.json(); })
      .then(function(d){
        if (d && d.status === "completed") { clearInterval(timer); done(d); }
      })
      .catch(function(){ /* réseau : on réessaie au prochain tick */ });
  }
  tick();
  timer = setInterval(function(){ n++; if (n > 120) clearInterval(timer); tick(); }, 1500);
})();
</script>
</body>
</html>
